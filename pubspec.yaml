name: fit_camp_mobile
description: "24 Fit Camp - Gym Management Mobile App for Members and Trainers"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  convex_flutter: ^3.0.0
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0
  image_picker: ^1.0.7
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  connectivity_plus: ^6.0.0
  flutter_secure_storage: ^9.2.4
  http: ^1.2.0
  fl_chart: ^0.69.0
  table_calendar: ^3.1.2
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  lottie: ^3.1.0
  riverpod_annotation: ^2.6.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.4.3
  build_runner: ^2.5.4
  freezed: ^3.1.0
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  assets:
    - assets/illustrations/
    - assets/illustrations/onboarding/
    - assets/lottie/
